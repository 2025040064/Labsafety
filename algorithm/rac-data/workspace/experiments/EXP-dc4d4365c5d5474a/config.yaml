schema_version: 1
experiment:
  name: cnc_physical_tool_holdout
  seed: 42
data:
  dataset_id: cnc_milling_2025
  path: F:\A_LIU_Astrspire\A_competition\工业制造场景下的模型训练与超参数优化系统\datasets\raw\cnc_milling_2025\FeatureAndMetadata_Milling.csv
model:
  name: lightgbm
  n_estimators: 300
  early_stopping_rounds: 30
  n_jobs: 4
optimization:
  algorithm: tpe_robust
  max_trials: 100000
  timeout_seconds: 10.0
  search_space:
    learning_rate:
      type: float
      low: 0.01
      high: 0.2
      log: true
    num_leaves:
      type: int
      low: 8
      high: 64
    max_depth:
      type: int
      low: 3
      high: 10
    min_child_samples:
      type: int
      low: 20
      high: 150
    feature_fraction:
      type: float
      low: 0.6
      high: 1.0
    lambda_l2:
      type: float
      low: 1.0e-05
      high: 10.0
      log: true
  rac_hpo:
    warmup_trials: 16
    minimum_history: 16
    forward_holdout: 5
    min_forward_train: 8
    surrogate_trees: 48
    candidates: 128
    refit_interval: 4
    exploration_fraction: 0.2
    local_fraction: 0.5
    beta: 0.5
    gamma: 0.5
    t0: 0.01
    q_max: 0.5
    shrinkage_k: 5.0
    weakness_threshold: 1.0
    minimum_rank_correlation: 0.0
    maximum_mae_ratio: 1.25
    maximum_overall_degradation: 0.1
robustness:
  alpha: 0.3
  epsilon: 1.0e-08
  minimum_independent_groups: 5
output:
  save_trials: true
  save_model: true
